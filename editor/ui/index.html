<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>本地中文草稿 — Ellis</title><link rel="stylesheet" href="/field-design.css"><link rel="stylesheet" href="/__editor/editor.css"></head>
<body class="editor-app"><header class="editor-header"><div><p class="editor-kicker">ELLIS · LOCAL STUDIO</p><h1>中文草稿编辑器</h1></div><span class="local-badge">仅本地 · 未发布</span></header>
<main class="editor-main"><section class="editor-toolbar" aria-label="页面选择"><div><label for="page">选择页面</label><select id="page" disabled><option>正在读取页面…</option></select></div><p id="coverage">首版支持正文与 SEO 文案。未翻译区域仍显示英文，FAQ、共享导航／页尾及图片暂未开放编辑。</p></section>
<div class="editor-workspace"><section class="preview-panel" aria-label="原版式预览"><div class="preview-heading"><h2>中文草稿预览</h2><span>点选文字即可编辑 · 页面操作已禁用</span></div><iframe id="preview" title="原版式中文草稿预览" sandbox="allow-scripts allow-same-origin"></iframe></section>
<section class="edit-panel" aria-labelledby="edit-title"><p class="editor-kicker">CONTENT EDITOR</p><h2 id="edit-title">编辑中文文案</h2><label for="field">文字位置</label><select id="field" disabled><option>请稍候…</option></select><h3>英文原文（只读）</h3><p id="original" class="original">选择左侧文字，或从上方列表选择。</p><form id="edit-form" novalidate><label for="translation">中文草稿</label><textarea id="translation" rows="10" aria-describedby="field-help" disabled></textarea><p id="field-help">这里只保存中文文字，不更改英文或版式。电话、邮箱、价格等业务事实已锁定。</p><div class="actions"><button id="save" type="submit" disabled>保存中文草稿</button><button id="reload" type="button">重新载入</button></div><p id="status" role="status" aria-live="polite">正在连接本地服务…</p><p id="revision" class="revision"></p></form></section></div></main>
<dialog id="unsaved" aria-labelledby="unsaved-title"><h2 id="unsaved-title">当前中文草稿尚未保存</h2><p>切换页面或重新载入将丢弃本次未保存的编辑。已经保存的草稿不受影响。</p><div class="actions"><button id="keep" autofocus>继续编辑</button><button id="discard" class="secondary">丢弃本次编辑</button></div></dialog>
<script type="module" src="/__editor/client.js"></script></body></html>
